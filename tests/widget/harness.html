<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Better Delta Bar widget tests</title>
<style>
  body { margin: 0; background: #222; color: #ddd; font: 12px monospace; }
  /* stand-in for the game's HUD container */
  .absolutecenter { position: relative; width: 1600px; height: 900px; overflow: hidden; }
  #results { white-space: pre; }
</style>
<!-- shared test doubles (fake frame clock, in-memory localStorage, console capture) from the loader repo -->
<script src="../../../ACEUIAppLoader/tests/lib/doubles.js"></script>
<script>
// Fake game models, mutable by tests. The sentinel is what the game sends with no reference lap.
window.ModelCurrentCar = { has_focused_car: true, delta_time_ms_ui: 2147483647, delta_time_ms: 0, predicted_lap_time_ms: -1,
                           current_lap_time_ms: 5000, npos: 0.0, delta_time_drivername: "", car_location: "Track" };
window.ModelTiming = { best: "", ideal: "", last: "", current: "Outlap", invalid: true };
</script>
<!-- the ACEUIAppLoader library from the sibling checkout, in load order (in game it is part of cohtml.js) -->
<script src="../../../ACEUIAppLoader/tests/lib/lib.js"></script>
<link rel="stylesheet" type="text/css" href="../../betterdeltabar/betterdeltabar.css">
<!-- classic script, as the loader injects it: `BetterDeltaBar` is a page-wide binding -->
<script src="../../betterdeltabar/betterdeltabar.js"></script>
</head>
<body>
<div class="absolutecenter" id="center"></div>
<pre id="results"></pre>
<div id="done" hidden></div>

<script>
(function () {
    const H = window.__harness;
    const eq = H.eq, ok = H.ok, near = H.near;
    /**
     * Every case runs through this. A case that passes has put back what it changed; one that fails
     * part-way has not, and whatever it left (a pit location, a lap count, a setting, attract, a swapped
     * engine function, a lap record) would make the cases after it fail for the wrong reason. So on a
     * failure, and only then, the models go back to what they were when the case began, the settings
     * to their defaults, the lap record is let go and the widget is attached afresh; the failure is
     * still reported. A passing run is untouched.
     */
    const t = function (name, fn) {
        H.t(name, function () {
            const carBefore = Object.assign({}, window.ModelCurrentCar);
            const lowBefore = window.ModelCurrentCar.low_frequency ? Object.assign({}, window.ModelCurrentCar.low_frequency) : window.ModelCurrentCar.low_frequency;
            const timingBefore = Object.assign({}, window.ModelTiming);
            const engineBefore = window.engine && typeof window.engine === "object" ? Object.assign({}, window.engine) : null;
            const globalsBefore = { ModelCarsOnTrack: window.ModelCarsOnTrack, ModelUISessionState: window.ModelUISessionState,
                ModelUIRealtimeLeaderboard: window.ModelUIRealtimeLeaderboard, ModelLeaderboard: window.ModelLeaderboard, ksUI: window.ksUI };
            try {
                fn();
            } catch (e) {
                // the recovery is best effort and never replaces the failure being reported: the first cases run
                // before the engine, the root and the widget exist, and a recovery that threw there hid the reason
                try {
                    const restore = function (target, before) {
                        Object.keys(target).forEach(function (k) { if (!(k in before)) { delete target[k]; } });
                        Object.assign(target, before);
                    };
                    restore(window.ModelCurrentCar, carBefore);
                    window.ModelCurrentCar.low_frequency = lowBefore;
                    restore(window.ModelTiming, timingBefore);
                    if (engineBefore && window.engine && typeof window.engine === "object") { restore(window.engine, engineBefore); }
                    Object.keys(globalsBefore).forEach(function (k) { window[k] = globalsBefore[k]; });
                    window.ModelCurrentCar = car; window.ModelTiming = timing;
                    ACEUIAppLoader.settings.reset(me.name);
                    me.forget("lap");
                    B.detach(state); state = B.attach(root); frame();
                } catch (ignored) {
                    // nothing more to put back: the widget is not attached yet
                }
                throw e;
            }
        });
    };
    const me = ACEUIAppLoader.app("betterdeltabar");
    const B = BetterDeltaBar;
    const car = window.ModelCurrentCar;
    const timing = window.ModelTiming;
    const clock = window.__clock;
    const center = document.getElementById("center");
    const SENTINEL = 2147483647;

    const sx = function (el) { const m = /scaleX\((-?[\d.]+)\)/.exec(el.style.transform || ""); return m ? parseFloat(m[1]) : NaN; };
    const sy = function (el) { const m = /scaleY\((-?[\d.]+)\)/.exec(el.style.transform || ""); return m ? parseFloat(m[1]) : NaN; };
    const tx = function (el) { const m = /translateX\((-?[\d.]+)%\)/.exec(el.style.transform || ""); return m ? parseFloat(m[1]) : NaN; };
    const has = function (el, cls) { return el.classList.contains(cls); };
    const set = function (k, v) { ACEUIAppLoader.settings.set(me.name, k, v); };

    /** Set the delta the game would send: both fields carry the same number, and with no reference the raw one reads 0 while the ui one is the sentinel (measured). */
    const setDelta = function (ms) {
        if (ms === null) { car.delta_time_ms_ui = SENTINEL; car.delta_time_ms = 0; return; }
        car.delta_time_ms = ms;
        car.delta_time_ms_ui = ms;
    };

    let now = 1000;
    const FRAME = 16;
    /** One animation frame, FRAME ms later; `fn(now)` runs first, to move the fake models. */
    const frame = function (fn) { now += FRAME; if (fn) { fn(now); } clock.step(now); };
    /** Frames for `ms` of time. */
    const run = function (ms, fn) { const end = now + ms; while (now < end) { frame(fn); } };
    /** Drive the delta at `ratePerS` ms per second from its current value, for `ms`. */
    const drift = function (ms, ratePerS) {
        const start = car.delta_time_ms, t0 = now;
        run(ms, function (n) { setDelta(start + ratePerS * (n - t0) / 1000); });
    };

    t("library present, module present, constants as expected, load logged", function () {
        eq(typeof ACEUIAppLoader, "object", "ACEUIAppLoader library"); eq(typeof ACEUIAppLoader.panel, "object", "panel");
        eq(typeof B, "object", "BetterDeltaBar module");
        eq(B.NO_DELTA_MS, SENTINEL, "sentinel"); eq(B.TREND_HZ, 20); eq(B.TREND_N, 41, "the widest window plus the sample before it"); eq(B.TRACE_N, 120);
        eq(me.version, ACEUIAppLoader.loader.DEV_VERSION, "version comes from the loader"); eq(me.prefix, "[betterdeltabar]");
        eq(me.hudId, "hud_betterdeltabar"); eq(me.storageKey, "acebetterdeltabar.pos");
        ok(window.__log.some(function (l) { return l.indexOf(me.prefix + " script loaded, version " + me.version) >= 0; }), "the library logs the script-loaded line");
        eq(document.getElementById(me.name), null, "harness must not carry the auto-mount root");
    });

    t("formatDelta: sign only when there is one, seconds unpadded, minutes past sixty, rounded to the decimals shown", function () {
        eq(B.formatDelta(-235, 3), "-0.235"); eq(B.formatDelta(235, 3), "+0.235"); eq(B.formatDelta(0, 3), "0.000");
        eq(B.formatDelta(-235, 2), "-0.24"); eq(B.formatDelta(4, 2), "0.00", "rounds to nothing, so no sign");
        eq(B.formatDelta(62345, 3), "+1:02.345"); eq(B.formatDelta(-1500, 3), "-1.500"); eq(B.formatDelta(-1500, 2), "-1.50");
    });

    t("formatLap and parseLap: the game's strings both ways, placeholders for anything else", function () {
        eq(B.formatLap(103210), "1:43.210"); eq(B.formatLap(-1), "-:--.---"); eq(B.formatLap(0), "-:--.---"); eq(B.formatLap(undefined), "-:--.---");
        eq(B.parseLap("1:43.445"), 103445); eq(B.parseLap("01:43.445"), 103445); eq(B.parseLap("1:02:03.456"), 3723456);
        eq(B.parseLap(""), null); eq(B.parseLap("Outlap"), null); eq(B.parseLap(undefined), null);
    });

    t("readModel: null without a focused car; the sentinel is no delta; the raw delta is preferred; npos_perc stands in for npos", function () {
        car.has_focused_car = false;
        try { eq(B.readModel(), null); } finally { car.has_focused_car = true; }
        let m = B.readModel();
        try {
            eq(m.delta, null, "sentinel is no delta"); eq(m.npos, 0); eq(m.driver, ""); eq(m.best, ""); eq(m.optimal, ""); eq(m.last, "");
            eq(m.invalid, false, "the outlap is flagged invalid by the game, and that is not news");
            timing.current = ""; m = B.readModel(); eq(m.invalid, false, "nor is no lap at all");
            timing.current = "0:12.345"; m = B.readModel(); eq(m.invalid, true, "a timed lap's flag is");
            timing.invalid = false; m = B.readModel(); eq(m.invalid, false);
        } finally {   // what every case below starts from: the flag down, the out-lap text
            timing.invalid = false; timing.current = "Outlap";
        }
        try {
            setDelta(-235); m = B.readModel(); eq(m.delta, -235, "raw ms"); eq(m.lapMs, 5000);
            // the two fields carry the same number in the game; set apart by hand, a malformed raw one falls back to the ui copy
            car.delta_time_ms = "junk"; car.delta_time_ms_ui = -240; m = B.readModel(); eq(m.delta, -240, "falls back to the UI copy");
            car.npos = undefined; car.npos_perc = 25; m = B.readModel(); near(m.npos, 0.25, 1e-9, "npos from npos_perc");
            car.npos_perc = undefined; m = B.readModel(); eq(m.npos, null, "no position at all");
            timing.ideal = "1:43.102"; m = B.readModel(); eq(m.optimal, "1:43.102", "the optimal lap is the timing model's ideal");
        } finally {   // whatever was judged, the model goes back to what the cases below expect
            timing.ideal = ""; car.npos = 0; car.npos_perc = undefined; setDelta(null);
        }
    });

    // the game's engine, as far as the widget uses it: a place to subscribe to UI notifications
    const engineHandlers = {};
    window.engine = {
        on: function (name, cb) { engineHandlers[name] = cb; return { clear: function () { delete engineHandlers[name]; } }; },
        trigger: function () {},
        // the game's translation table, as far as the widget asks it: the one reason key measured so far
        translate: function (key) { const table = { InvestigationType_Racecar_Cut: "Track Limits" }; return Object.prototype.hasOwnProperty.call(table, key) ? table[key] : key; },
        // the model getters the stock calls each frame; the widget asks for the penalty state itself
        calls: [],
        // answers at once, or, while __pending is an array, holds each answer there for the case to release (or never)
        call: function (name) {
            engineHandlers.__calls = (engineHandlers.__calls || 0) + 1;
            if (engineHandlers.__pending) { return { then: function (ok, fail) { engineHandlers.__pending.push({ ok: ok, fail: fail }); } }; }
            return { then: function (ok) { ok({ penalties: [] }); } };
        }
    };
    const notify = function (message) { engineHandlers.UINotification(message); };
    const penalty = function (head, reason, type) { return { type: "UINotificationType_SessionPenalty", tuples: [{ values: [head, reason, type] }] }; };
    window.ModelCarsOnTrack = { cars_on_track: [{ car_number: 12, is_focused: false }, { car_number: 666, is_focused: true }] };

    const root = document.createElement("div");
    center.appendChild(root);
    let state = B.attach(root);
    const q = function (s) { return root.querySelector(s); };
    const figure = q(".bd-delta"), left = q(".bd-left"), right = q(".bd-right"), tick = q(".bd-ticktrack"), main = q(".bd-main");
    const ups = Array.prototype.slice.call(root.querySelectorAll(".bd-up"));
    const downs = Array.prototype.slice.call(root.querySelectorAll(".bd-down"));
    const cellTime = function (name) { return q(".bd-cell-" + name + " .bd-time").textContent; };

    t("attach builds the markup once: bar, figure, chevrons, tick, 120 trace slots, four cells; panel and loop wired", function () {
        ok(has(root, "ace-betterdeltabar"), "root class"); ok(!has(root, "bd-compact"), "full layout by default");
        ok(left && right && figure && tick, "bar fills, figure, tick"); eq(root.querySelectorAll(".bd-arrow").length, 2, "two chevrons");
        eq(root.querySelectorAll(".bd-slot").length, 120, "slots"); eq(ups.length, 120); eq(downs.length, 120);
        eq(root.querySelectorAll(".bd-cell").length, 4, "cells");
        ["optimal", "best", "last", "pred"].forEach(function (c) { eq(cellTime(c), "-:--.---", c + " placeholder"); });
        eq(q(".bd-cell-optimal .bd-label").textContent, "SESSION OPTIMAL"); eq(q(".bd-cell-pred .bd-label").textContent, "PREDICTED LAP");
        eq(figure.textContent, "--.---", "placeholder before the first frame");
        eq(getComputedStyle(root).position, "absolute", "stylesheet applied");
        eq(root.style.visibility, "hidden", "hidden until positioned");
        eq(state.ui.panel.root, root, "panel attached"); eq(state.ui.panel.hudId, me.hudId); ok(state.ui.loop && state.ui.loop.running, "loop running");
        eq(clock.queue.length, 1, "one animation frame requested");
        ok(has(root, "bd-flat"), "starts flat");
        ok(has(root, "bd-notrace"), "trace off by default"); ok(has(root, "bd-nolast"), "last lap off by default");
        ok(!has(root, "bd-nooptimal") && !has(root, "bd-nobest") && !has(root, "bd-nopred"), "optimal, best and predicted on");
        eq(getComputedStyle(q(".bd-cell-last")).display, "none", "last cell hidden"); eq(getComputedStyle(q(".bd-trace")).display, "none", "trace hidden");
        ups.forEach(function (u) { eq(u.style.transform, "scaleY(0)", "trace blank"); });
    });

    t("no reference lap: dim placeholder, empty bar, tick hidden, the top line counts the lap so the widget is visibly alive", function () {
        frame();
        ok(has(root, "bd-noref"), "bd-noref"); ok(has(root, "bd-top-on"), "top line shows the note");
        eq(figure.textContent, "--.---"); eq(sx(left), 0); eq(sx(right), 0); eq(tx(tick), 0, "tick at the centre");
        ok(!has(root, "bd-faster") && !has(root, "bd-slower"), "no sign");
        eq(getComputedStyle(q(".bd-status")).display, "block", "the note is visible");
        eq(q(".bd-status").textContent, "no reference yet · lap 0:05.0", "the running lap, to the tenth (lap time 5000 ms)");
        car.current_lap_time_ms = 65432; frame(); eq(q(".bd-status").textContent, "no reference yet · lap 1:05.4", "ticking");
        car.current_lap_time_ms = 0; frame(); eq(q(".bd-status").textContent, "no reference lap", "no lap running: the plain note");
        car.current_lap_time_ms = 5000; frame();
        eq(getComputedStyle(q(".bd-tick")).opacity, "0", "tick hidden");
        eq(getComputedStyle(root).visibility, "hidden", "(the panel keeps it hidden until positioned)");
    });

    t("the option to hide the widget until there is a reference lap", function () {
        const vis = root.style.visibility;
        root.style.visibility = "";
        try {
            eq(getComputedStyle(root).visibility, "visible", "shown by default with no reference");
            set("hideWithoutReference", true); ok(has(root, "bd-hide-noref"));
            eq(getComputedStyle(root).visibility, "hidden", "hidden while there is no reference");
            setDelta(-235); frame(); eq(getComputedStyle(root).visibility, "visible", "shown as soon as there is a delta");
            setDelta(null); frame(); eq(getComputedStyle(root).visibility, "hidden", "and gone again without one");
            set("hideWithoutReference", false); eq(getComputedStyle(root).visibility, "visible");
        } finally {
            set("hideWithoutReference", false); root.style.visibility = vis;
        }
    });

    t("time gained grows right (the game's convention): the right fill, the tick at its end, the figure, the sign", function () {
        setDelta(-235); frame();
        eq(figure.textContent, "-0.235"); near(sx(right), 0.235, 1e-6, "right fill is |delta| / range"); eq(sx(left), 0);
        near(tx(tick), 11.75, 1e-6, "tick moved by half the width times the share"); eq(tx(main), 0, "the figure stays put in the full layout");
        ok(has(root, "bd-faster"), "faster"); ok(!has(root, "bd-slower")); ok(!has(root, "bd-noref"));
        ok(!has(root, "bd-top-on"), "top line has nothing to say");
        eq(getComputedStyle(q(".bd-top")).display, "none");
    });

    t("time lost grows left, past the range: the left fill full, the figure exact", function () {
        setDelta(1500); frame();
        eq(figure.textContent, "+1.500"); eq(sx(left), 1, "clamped"); eq(sx(right), 0); near(tx(tick), -50, 1e-6, "tick at the left end"); ok(has(root, "bd-slower"));
        setDelta(0); frame(); eq(figure.textContent, "0.000"); ok(!has(root, "bd-slower") && !has(root, "bd-faster"), "zero has no sign"); eq(tx(tick), 0);
    });

    t("the faster side option turns the bar round", function () {
        set("fasterSide", "left"); setDelta(-235); frame();
        near(sx(left), 0.235, 1e-6, "gained time on the left now"); eq(sx(right), 0); near(tx(tick), -11.75, 1e-6);
        setDelta(500); frame(); near(sx(right), 0.5, 1e-6, "lost time on the right"); eq(sx(left), 0);
        set("fasterSide", "right"); frame(); near(sx(left), 0.5, 1e-6, "and back");
    });

    t("unchanged values are not rewritten", function () {
        setDelta(-235); frame();
        figure.textContent = "sentinel"; right.style.transform = "scaleX(0.5)"; frame();
        eq(figure.textContent, "sentinel", "text not rewritten"); eq(right.style.transform, "scaleX(0.5)", "transform not rewritten");
        setDelta(-236); frame(); eq(figure.textContent, "-0.236"); near(sx(right), 0.236, 1e-6);
    });

    t("the trend: gaining colours green after a window, strongly when fast; steady is flat; losing is red", function () {
        setDelta(-235); frame();
        drift(1500, -40);
        ok(has(root, "bd-gain"), "gaining at 40 ms/s (band 15)"); ok(!has(root, "bd-strong"), "not strong under 75 ms/s");
        ok(!has(root, "bd-flat") && !has(root, "bd-lose"));
        eq(getComputedStyle(q(".bd-arrow-r")).opacity, "0.9", "gaining: the chevron points right, where the fill is heading");
        eq(getComputedStyle(q(".bd-arrow-l")).opacity, "0", "and not left");
        eq(getComputedStyle(q(".bd-arrow-r")).borderLeftColor, "rgb(68, 234, 120)", "in green");
        drift(1500, -600);
        ok(has(root, "bd-gain") && has(root, "bd-strong"), "strong at 600 ms/s");
        eq(getComputedStyle(q(".bd-arrow-r")).opacity, "1", "brighter when strong");
        run(1500);
        ok(has(root, "bd-flat"), "steady reads flat"); ok(!has(root, "bd-strong"));
        eq(getComputedStyle(q(".bd-arrow-r")).opacity, "0", "no chevron when flat");
        drift(1500, 40);
        ok(has(root, "bd-lose"), "losing"); ok(!has(root, "bd-gain"));
        eq(getComputedStyle(q(".bd-arrow-l")).opacity, "0.9", "losing: the chevron points left, where the fill is heading");
        eq(getComputedStyle(q(".bd-arrow-l")).borderRightColor, "rgb(255, 20, 24)", "in red");
        eq(getComputedStyle(q(".bd-arrow-r")).opacity, "0");
    });

    t("with the faster side on the left the chevrons turn round with the bar", function () {
        set("fasterSide", "left"); ok(has(root, "bd-faster-left"));
        ok(has(root, "bd-lose"), "still losing");
        eq(getComputedStyle(q(".bd-arrow-r")).opacity, "0.9", "losing points right now"); eq(getComputedStyle(q(".bd-arrow-l")).opacity, "0");
        eq(getComputedStyle(q(".bd-arrow-r")).borderLeftColor, "rgb(255, 20, 24)", "red");
        drift(1500, -600); ok(has(root, "bd-gain") && has(root, "bd-strong"));
        eq(getComputedStyle(q(".bd-arrow-l")).opacity, "1", "gaining strongly points left"); eq(getComputedStyle(q(".bd-arrow-r")).opacity, "0");
        eq(getComputedStyle(q(".bd-arrow-l")).borderRightColor, "rgb(68, 234, 120)", "green");
        set("fasterSide", "right"); ok(!has(root, "bd-faster-left"));
        eq(getComputedStyle(q(".bd-arrow-r")).opacity, "1", "and back");
    });

    t("hysteresis: a trend is left at half the band, not entered under it", function () {
        drift(1500, -40); ok(has(root, "bd-gain"), "gaining");
        drift(1500, -10); ok(has(root, "bd-gain"), "10 ms/s keeps a trend already on (leave at 7.5)");
        drift(1500, -5); ok(has(root, "bd-flat"), "5 ms/s lets go");
        drift(1500, -10); ok(has(root, "bd-flat"), "10 ms/s does not start one (band 15)");
    });

    t("hysteresis is one-sided: entering the other trend needs the whole band, so jitter smaller than the band cannot flip the colour", function () {
        drift(1500, -40); ok(has(root, "bd-gain"), "gaining");
        drift(1500, 9); ok(has(root, "bd-flat"), "+9 ms/s from gaining is flat, not losing (the half band is for staying, not for the other side)");
        drift(1500, 40); ok(has(root, "bd-lose"), "losing at the full band");
        drift(1500, -9); ok(has(root, "bd-flat"), "and -9 from losing is flat, not gaining");
        // the same in one step: gaining at -40, then a single jump of +52 ms puts the rate at about +12 in one sample, past
        // half the band (7.5) but under the whole of it (15). Staying needs half the band; the other side needs all of it
        drift(1500, -40); ok(has(root, "bd-gain"), "gaining again");
        setDelta(car.delta_time_ms + 52); run(64);
        ok(!has(root, "bd-lose"), "a rate of about +12 from gaining is not losing: the half band never lets a trend cross to the other side");
        drift(1500, 0);
        // the flapping case: a steady driver and a delta read with a millisecond or two of noise, after a real trend
        set("trendBand", "fine"); set("trendWindow", "0.5 s");
        const base = car.delta_time_ms;
        try {
            eq(state.band, 5); eq(state.windowSamples, 10);
            drift(1500, -40); ok(has(root, "bd-gain"));
            const noisy = car.delta_time_ms; let flips = 0, last = state.trend;
            run(3000, function (n) { setDelta(noisy + (Math.floor(n / FRAME) % 2 === 0 ? 1 : -1)); if (state.trend !== last) { flips += 1; last = state.trend; } });
            eq(state.trend, "flat", "settled flat"); ok(flips <= 1, "left the trend once and never came back: " + flips + " change(s)");
        } finally {
            set("trendBand", "normal"); set("trendWindow", "1 s"); setDelta(base); run(1500);
        }
    });

    t("a stall a few ms short of the sampler's gap still forgets the ring: the ring and the sampler restart on the same clock", function () {
        setDelta(-300); drift(1500, -40); ok(has(root, "bd-gain")); ok(state.count >= 30, "a settled ring: " + state.count);
        while (now - state.sampler.lastSampleAt < 2) { frame(); }      // the sampler's clock must trail the frame clock by at least 2 ms here
        const since = now - state.sampler.lastSampleAt;
        now += 1999 - FRAME; setDelta(400); frame();                    // the frame clock's gap is 1999 ms (under the threshold); the sampler's is 1999 + since, over it
        ok(since >= 2, "phase: the sampler trails by " + since + " ms");
        ok(state.count <= 1, "ring restarted with the sampler: " + state.count); ok(has(root, "bd-flat"), "flat, not a 400 ms/s loss spanning the stall");
        run(100); ok(!has(root, "bd-strong") && has(root, "bd-flat"), "still flat until a new window is in");
        drift(1500, -40); ok(has(root, "bd-gain"), "and gaining again once it is");
    });

    t("the strong glow has a one-sided hysteresis too: a rate hovering at five bands does not blink it, and it is kept down to four bands", function () {
        drift(1500, -80); ok(has(root, "bd-gain") && has(root, "bd-strong"), "strong at 80 ms/s (threshold 75)");
        drift(1500, -65); ok(has(root, "bd-strong"), "65 ms/s keeps it (kept to 60)");
        drift(1500, -55); ok(!has(root, "bd-strong"), "55 ms/s lets go"); ok(has(root, "bd-gain"), "still gaining");
        drift(1500, -70); ok(!has(root, "bd-strong"), "70 ms/s does not start it again (enter at 75)");
        drift(1500, -80); ok(has(root, "bd-strong"));
        // the wobble has to be slower than the trend window, or the window averages it away and the
        // rate never reaches the threshold at all: in blocks of 1.5 s the rate settles near 70 and 83,
        // so it dips under the 75 it takes to enter and stays above the 60 it takes to keep
        let blinks = 0, was = true;
        const from = now;
        run(6000, function (n) { setDelta(car.delta_time_ms - (Math.floor((n - from) / 1500) % 2 === 0 ? 0.07 : 0.083) * FRAME); const s = has(root, "bd-strong"); if (s !== was) { blinks += 1; was = s; } });

    t("the figure's point is on the bar's centre mark and its tag hugs the digits: the tag and chevrons lean by the glyphs either side of the point", function () {

        const leanOn = function () { return leans.filter(function (c) { return has(root, c); }); };
        const group = q(".bd-group");
        const shiftPx = function () { return new DOMMatrix(getComputedStyle(group).transform).m41; };
        const fontPx = function () { return parseFloat(getComputedStyle(figure).fontSize); };
        // the lean follows the text: the width after the point less the width before, in half glyphs (a colon is one, a digit two)
        const cases = [[-235, "-0.235", "bd-lean-2"], [12345, "+12.345", "bd-lean-0"], [0, "0.000", "bd-lean-4"], [62345, "+1:02.345", "bd-lean-n3"], [602345, "+10:02.345", "bd-lean-n5"], [null, "--.---", "bd-lean-2"]];
        cases.forEach(function (c) {
            setDelta(c[0]); frame();
            eq(figure.textContent, c[1]); eq(leanOn().join(" "), c[2], c[1] + " leans " + c[2] + ", and no other lean is on");
        });
        set("decimals", "2"); setDelta(-235); frame(); eq(figure.textContent, "-0.24"); eq(leanOn().join(" "), "bd-lean-0", "two decimals: -0.24 balances about its point");
        setDelta(602345); frame(); eq(figure.textContent, "+10:02.35"); eq(leanOn().join(" "), "bd-lean-n7", "the widest figure there is leans furthest left");
        ACEUIAppLoader.settings.reset(me.name);
        // every lean moves the row by (lean x CELL / 4 + POINT / 2 - INK) of the figure's font, in both
        // layouts: the stylesheet's two tables, worked out from the game font's metrics
        const CELL = 0.511, POINT = 0.255, INK = 0.102;
        ["full", "compact"].forEach(function (layout) {
            set("layout", layout); setDelta(-235); frame();
            const was = leanOn()[0];
            leans.forEach(function (c, i) {
                leans.forEach(function (other) { root.classList.remove(other); });
                root.classList.add(c);
                const lean = i + LEAN_MIN;
                near(shiftPx(), (lean * CELL / 4 + POINT / 2 - INK) * fontPx(), 0.002 * fontPx(), layout + ": " + c + " moves the row " + shiftPx().toFixed(2) + " px");
            });
            leans.forEach(function (other) { root.classList.remove(other); });
            root.classList.add(was);
            // the chevrons move with the tag: the gaps either side of it stay equal
            const tag = figure.getBoundingClientRect(), l = q(".bd-arrow-l").getBoundingClientRect(), r = q(".bd-arrow-r").getBoundingClientRect();
            near(tag.left - l.right, r.left - tag.right, 0.5, layout + ": the chevrons stand the same distance from the tag");
        });

    t("soak: forty seconds of the scripted lap in each layout, every frame checked for the invariants that tie the parts together", function () {
        const wasAttract = state.attract;
        const fmt = function (ms) { return B.formatDelta(ms, state.decimals); };
        let checked = 0, faults = [];
        const fault = function (what) { if (faults.length < 8) { faults.push(what + " at " + now); } };
        const check = function (compact) {
            const v = B.attractValues(now), delta = v.delta;
            const trend = ["bd-gain", "bd-lose", "bd-flat"].filter(function (c) { return has(root, c); });
            const share = Math.min(1, Math.abs(delta) / state.rangeMs);
            const onRight = delta !== 0 && (delta < 0) === state.fasterRight;
            if (trend.length !== 1) { fault("trend classes " + trend.join("+")); }
            if (has(root, "bd-strong") && has(root, "bd-flat")) { fault("strong while flat"); }
            if (has(root, "bd-faster") !== (delta < 0) || has(root, "bd-slower") !== (delta > 0)) { fault("sign classes vs delta " + delta); }
            if (has(root, "bd-noref")) { fault("noref with a delta"); }
            if (figure.textContent !== fmt(delta)) { fault("figure " + figure.textContent + " vs " + fmt(delta)); }
            if (sx(left) > 0 && sx(right) > 0) { fault("both fills"); }
            // `!(x <= eps)`, not `x > eps`: a transform never written parses to NaN, which must fail too
            if (!(Math.abs(sx(onRight ? right : left) - (delta === 0 ? 0 : share)) <= 1e-3)) { fault("fill share"); }
            if (!(Math.abs(sx(onRight ? left : right)) <= 1e-9) && delta !== 0) { fault("fill on the wrong side"); }
            if (!(Math.abs(tx(tick) - (delta === 0 ? 0 : (onRight ? share : -share) * 50)) <= 0.02)) { fault("tick shift"); }
            if (!(Math.abs(tx(main) - (compact && state.followOn ? tx(tick) : 0)) <= 1e-9)) { fault("figure row shift"); }
            if (has(root, "bd-top-on") !== (has(root, "bd-hasdriver") || has(root, "bd-invalid") || has(root, "bd-noref"))) { fault("top line vs its contents"); }
            // the chevron that shows is the one on the side the fill's end is moving to
            const l = getComputedStyle(q(".bd-arrow-l")).opacity !== "0", r = getComputedStyle(q(".bd-arrow-r")).opacity !== "0";
            if (has(root, "bd-flat") && (l || r)) { fault("chevron while flat"); }
            if (has(root, "bd-gain") && (l !== !state.fasterRight || r !== state.fasterRight)) { fault("gain chevron side"); }
            if (has(root, "bd-lose") && (l !== state.fasterRight || r !== !state.fasterRight)) { fault("lose chevron side"); }
            const pred = q(".bd-cell-pred");
            const gap = v.predicted - B.parseLap(v.best), fasterOn = has(pred, "bd-pred-faster"), slowerOn = has(pred, "bd-pred-slower");
            if ((fasterOn && slowerOn) || (fasterOn && gap >= 0) || (slowerOn && gap <= 0) || (gap <= -B.PRED_BAND_MS && !fasterOn) || (gap >= B.PRED_BAND_MS && !slowerOn)
                || (Math.abs(gap) < B.PRED_BAND_MS * B.HYSTERESIS && (fasterOn || slowerOn))) { fault("predicted colour (predicted " + v.predicted + ", bestMs " + state.bestMs + ", classes " + pred.className + ", predState " + state.predState + ")"); }
            checked += 1;
        };
        B.setAttract(state, true);
        [false, true].forEach(function (compact) {
            set("layout", compact ? "compact" : "full"); frame();
            [true, false].forEach(function (right) {
                set("fasterSide", right ? "right" : "left");
                // judged AFTER each frame is drawn, against the truth for that same frame
                const end = now + 20000;
                while (now < end) { frame(); check(compact); }
            });

    t("options reach the live widget: decimals, range, colours, width, what is shown", function () {

        set("decimals", "2"); frame(); eq(figure.textContent, "-0.24", "reformatted although the delta did not move");
        set("range", "2 s"); frame(); near(sx(right), 0.1175, 0.0006, "half the fill at twice the range, of the delta itself (-235 ms; transforms are written to a thousandth)");
        set("numberColour", "overall"); ok(has(root, "bd-num-overall")); set("numberColour", "white"); ok(has(root, "bd-num-white")); ok(!has(root, "bd-num-overall"));
        set("barColour", "trend"); ok(has(root, "bd-bar-trend"));
        set("width", "narrow"); ok(has(root, "bd-narrow")); set("width", "wide"); ok(has(root, "bd-wide")); ok(!has(root, "bd-narrow"));
        set("showArrows", false); ok(has(root, "bd-noarrows")); eq(getComputedStyle(q(".bd-arrow-l")).display, "none");
        set("showOptimal", false); ok(has(root, "bd-nooptimal")); eq(getComputedStyle(q(".bd-cell-optimal")).display, "none");
        set("showLast", true); ok(!has(root, "bd-nolast")); eq(getComputedStyle(q(".bd-cell-last")).display, "flex", "last cell shown");
        set("showLast", false); set("showBest", false); set("showPredicted", false); eq(getComputedStyle(q(".bd-cells")).display, "none", "no cell row when every cell is off");
        set("showInvalid", false); timing.invalid = true; timing.current = "0:12.345"; frame(); ok(!has(root, "bd-invalid"), "invalid ignored when off");
        set("showInvalid", true); frame(); ok(has(root, "bd-invalid"), "(and back on, the cut shows: the lap started valid)"); set("showInvalid", false); timing.invalid = false;
        car.delta_time_drivername = "Max"; frame(); ok(has(root, "bd-hasdriver"), "the driver name has no switch: shown whenever the game names one"); car.delta_time_drivername = ""; frame();
        set("trendBand", "coarse"); eq(state.band, 40); set("trendWindow", "0.5 s"); eq(state.windowSamples, 10); eq(state.windowMs, 500);
        set("background", "none"); ok(has(root, "bd-bg-none"));
        ACEUIAppLoader.settings.reset(me.name); frame();
        eq(figure.textContent, "-0.235"); ok(!has(root, "bd-nooptimal") && !has(root, "bd-num-white") && !has(root, "bd-bg-none"), "defaults back");
        eq(state.band, 15); eq(state.windowSamples, 20); eq(state.rangeMs, 1000); eq(state.fasterRight, true);
        car.current_lap_time_ms = 20; timing.invalid = false; frame(); car.current_lap_time_ms = 200; frame(); ok(!has(root, "bd-invalid"), "a clean lap for what follows");
    });

    t("HUD hidden: nothing is drawn but the trend keeps sampling", function () {
        document.body.classList.add(ACEUIAppLoader.HUD_HIDDEN_CLASS);
        const before = state.count;
        figure.textContent = "sentinel"; drift(500, -40);
        const text = figure.textContent, count = state.count;
        document.body.classList.remove(ACEUIAppLoader.HUD_HIDDEN_CLASS); frame();   // put back before judging
        eq(text, "sentinel", "no writes while hidden"); ok(count > before, "sampled: " + count); ok(figure.textContent !== "sentinel", "drawn again");
    });

    t("a cut survives the HUD reload on Escape/resume: remembered by lap, restored on the same lap, forgotten on the next", function () {
        car.low_frequency = { total_lap_count: 3 }; car.current_lap_time_ms = 20000; frame(); eq(state.lapCount, 3, "the lap count is read"); ok(!has(root, "bd-invalid"), "clean before the notice");
        notify(penalty("{PENALTY_CLEARED_KEY} #666", "InvestigationType_Racecar_Cut", "lblNotificationPenalty_LAP_INVALIDATED")); frame();
        ok(!has(root, "bd-invalid"), "the notice alone: no tag while the game's flag is down"); eq(state.lapCut, true, "but the cut is on record");
        timing.invalid = true; frame(); ok(has(root, "bd-invalid"), "the flag: the tag, with the notice's reason"); eq(q(".bd-invalid-tag").textContent, "INVALID · TRACK LIMITS");
        eq(me.recall("lap", null).lap, 3, "remembered with its lap");
        // Escape and resume: the page is rebuilt, the widget attached afresh, the flag still up
        B.detach(state); root.classList.remove("bd-invalid"); q(".bd-invalid-tag").textContent = "";
        car.current_lap_time_ms = 25000; state = B.attach(root); frame();
        ok(has(root, "bd-invalid"), "the cut is back on the first frame"); eq(state.lapCut, true); eq(state.cutReason, "TRACK LIMITS");
        eq(q(".bd-invalid-tag").textContent, "INVALID · TRACK LIMITS", "with its reason");
        // the next lap: forgotten
        car.low_frequency.total_lap_count = 4; car.current_lap_time_ms = 100; frame();
        ok(!has(root, "bd-invalid"), "new lap, no tag"); eq(me.recall("lap", null), null, "and nothing remembered");
        // a reload onto a different lap than the one remembered: forgotten too
        me.remember("lap", { lap: 2, at: 50, cut: true }); B.detach(state); state = B.attach(root); frame();
        ok(!has(root, "bd-invalid"), "a remembered cut from another lap is dropped"); eq(me.recall("lap", null), null);
        // the same lap count but an earlier lap time: a new session whose first lap has the same number as the old one's
        me.remember("lap", { lap: 4, at: 20000, cut: true }); car.current_lap_time_ms = 3000; B.detach(state); state = B.attach(root); frame();
        ok(!has(root, "bd-invalid"), "a lap clock that went backwards is not the same lap"); eq(me.recall("lap", null), null);
        // a record filed under a lap number is matched against a lap number only: a first frame without the count is not this car's
        me.remember("lap", { lap: 4, at: 2000, cut: true }); car.low_frequency = undefined; B.detach(state); root.classList.remove("bd-invalid"); state = B.attach(root); frame();
        ok(!has(root, "bd-invalid"), "no count to match the record against: not restored"); eq(state.lapCut, false);
        eq(state.restorePending, true, "the record waits for a frame with the count"); ok(me.recall("lap", null) !== null, "and is kept meanwhile");
        car.current_lap_time_ms = 20; frame(); eq(state.restorePending, false); eq(me.recall("lap", null), null, "a new lap settles it: the waiting record is let go");
        car.current_lap_time_ms = 3100; frame();
        // from a car model that never gave a lap count, the lap time and the flag decide: still running and still flagged is the same lap
        eq(state.lapCount, null); notify(penalty("{PENALTY_CLEARED_KEY} #666", "r", "lblNotificationPenalty_LAP_INVALIDATED")); frame(); ok(has(root, "bd-invalid")); eq(me.recall("lap", null).lap, null);
        B.detach(state); car.current_lap_time_ms = 5000; state = B.attach(root); frame(); ok(has(root, "bd-invalid"), "later in the lap, flag up: kept");
        B.detach(state); car.current_lap_time_ms = 50; state = B.attach(root); frame(); ok(!has(root, "bd-invalid"), "lap time wrapped: a new lap, dropped");
        timing.invalid = false; car.current_lap_time_ms = 200; frame();
    });

    t("the lap trace comes back after Escape/resume on the same lap, the stretch passed during the reload blank; another lap's trace is not drawn", function () {
        const had = state.traceOn;
        set("showTrace", true); car.low_frequency = { total_lap_count: 4 }; car.current_lap_time_ms = 20; timing.invalid = false; car.npos = 0.01; frame();
        car.current_lap_time_ms = 30000; car.npos = 0.30; setDelta(-500); frame(); car.npos = 0.31; frame();
        near(sy(ups[37]), 0.5, 1e-6, "drawn before the reload");
        B.detach(state); state = B.attach(root);
        car.current_lap_time_ms = 36000; car.npos = 0.40; setDelta(-400); frame();
        near(sy(ups[37]), 0.5, 1e-6, "back after the reload"); near(sy(ups[36]), 0.5, 1e-6);
        eq(sy(ups[41]), 0, "a slot passed while the page reloaded had no data: blank"); near(sy(ups[48]), 0.4, 1e-6, "and the trace goes on from where the car is");
        B.detach(state); car.low_frequency = { total_lap_count: 5 }; state = B.attach(root); frame();
        eq(sy(ups[37]), 0, "a trace kept on lap 4 is not drawn on lap 5");
        car.low_frequency = undefined; car.current_lap_time_ms = 20; car.npos = 0.01; frame(); car.current_lap_time_ms = 200; frame();
        set("showTrace", had);
    });

    t("attract mode draws the lap trace it has driven so far at once, from its script, so a recording never starts with an empty strip", function () {
        const had = state.traceOn;
        set("showTrace", true);
        // a moment 30 s into a lap of the script
        now = B.attractLap(B.attractValues(now).lapCount + 1).start + 30000 - FRAME;
        B.setAttract(state, true); frame();
        const v = B.attractValues(now), slot = Math.floor(v.npos * B.TRACE_N);
        ok(slot > 20, "well into the lap: slot " + slot);
        eq(state.traceValues.slice(0, slot + 1).every(function (x) { return typeof x === "number"; }), true, "every slot up to the car's is drawn");
        eq(state.traceValues.slice(slot + 1).some(function (x) { return x !== null; }), false, "and none ahead of it");
        near(state.traceValues[slot - 10], B.attractDelta(B.attractLap(v.lapCount), (slot - 10 + 0.5) / B.TRACE_N), 1, "from the script");
        B.setAttract(state, false); set("showTrace", had);
        car.current_lap_time_ms = 20; car.npos = 0.01; frame(); car.current_lap_time_ms = 200; frame();
    });

    t("attract mode lasts a game session: it stays on through Escape/resume, and a restart switches it off, so a demo left on never shows on a real HUD", function () {
        B.setAttract(state, true);
        B.detach(state); state = B.attach(root); frame();
        eq(state.attract, true, "Escape/resume: still on, so a recording can go on across a pause");
        ACEUIAppLoader.persist.removeLocal("acebetterdeltabar.attract");   // the game closed: its local store went with it, the option did not
        const said = window.__log.length;
        B.detach(state); state = B.attach(root); frame();
        eq(state.attract, false, "the next game session: off"); eq(ACEUIAppLoader.settings.get(me.name, "attract"), false, "and the option with it");
        ok(window.__log.slice(said).some(function (l) { return l.indexOf("left on from an earlier game session") >= 0; }), "and the log says why");
        car.current_lap_time_ms = 20; frame(); car.current_lap_time_ms = 200; frame();
    });

    t("attract mode drives to the bar it is shown on: at a 5 s range every gain and loss is five times the 1 s one, so it swings as far across the bar; back at 1 s it is the same script again", function () {
        const at = B.attractLap(0).start + 45000;
        const one = B.attractValues(at, 1000), five = B.attractValues(at, 5000);
        ok(Math.abs(one.delta) > 100, "a moment with a delta worth comparing: " + one.delta);
        ok(Math.abs(five.delta / one.delta - 5) < 0.5, "five times the delta at five times the range (the few-ms flutter aside): " + five.delta + " vs " + one.delta);
        eq(five.lapCount, one.lapCount, "the same lap: a change of range stretches what is shown, it does not jump to another lap"); eq(five.lapMs, one.lapMs);
        near(B.parseLap(B.formatLap(five.predicted)) - B.parseLap(five.best), five.delta, 1, "the prediction is still the best shown plus the delta shown, to the ms");
        eq(JSON.stringify(B.attractValues(at, 1000)), JSON.stringify(one), "and the 1 s script is the same as before");
        eq(JSON.stringify(B.attractValues(at)), JSON.stringify(one), "no range given is the default one");
        ok(B.formatLap(B.attractLap(0).referenceMs) === "1:43.445", "the script starts against the same best at the default range");
    });

    t("attract mode has no spring in it: on a 0.5 s bar, over a whole lap, no two quick visible swings come one after the other, and a single quick bump is rare (a few-ms flutter swung back and forth twice a second)", function () {
        const L = B.attractLap(3);
        const visible = 500 * 0.005;          // half a percent of the half bar, about 2 px in game
        let dir = 0, turnAt = null, turnValue = null, prev = null, springs = 0, bumps = 0, lastQuick = false, first = "";
        for (let t = L.start; t < L.start + L.time; t += 16) {
            const d = B.attractValues(t, 500).delta;
            if (prev !== null && Math.abs(d - prev) > 1e-6) {
                const now = d > prev ? 1 : -1;
                if (dir !== 0 && now !== dir) {
                    const quick = turnAt !== null && t - turnAt < 1500 && Math.abs(prev - turnValue) > visible;
                    if (quick) { bumps += 1; }
                    if (quick && lastQuick) { springs += 1; if (!first) { first = (t - turnAt) + " ms, " + Math.abs(prev - turnValue).toFixed(1) + " ms of delta"; } }
                    lastQuick = quick;
                    turnAt = t; turnValue = prev;
                }
                dir = now;
            }
            prev = d;
        }
        eq(springs, 0, "no back-and-forth you could see" + (first ? ": " + first : ""));
        ok(bumps <= 3, "and few single quick bumps in a lap: " + bumps);
    });

    t("attract mode drives laps like a real session: the length their times say, measured part by part against the best lap, the delta always on the move with big swings both ways, the best improving when a lap beats it", function () {
        const lap0 = B.attractLap(0), lap1 = B.attractLap(1), lap2 = B.attractLap(2);
        const start = B.attractValues(0), mid = B.attractValues(Math.round(lap0.time / 2)), end = B.attractValues(lap0.time - 1), next = B.attractValues(lap0.time);
        eq(start.lapMs, 0); eq(start.npos, 0); eq(start.delta, 0, "the delta starts at 0 at the line");
        near(mid.npos, 0.5, 0.01); ok(end.npos > 0.99); eq(end.lapMs, lap0.time - 1, "the lap clock runs the lap's own length");
        ok(Math.abs(lap0.time - 103445) < 1000, "a lap about as long as the best it is compared with: " + lap0.time);
        eq(next.lapCount, 1); eq(next.lapMs, 0); eq(next.delta, 0, "and starts again at the next");
        eq(start.best, "1:43.445"); eq(start.last, "1:43.987"); eq(start.optimal, "1:43.445", "one lap so far: its sectors are the best"); eq(start.invalid, false);
        eq(next.last, B.formatLap(lap0.time), "the lap just driven is the last lap");
        eq(next.best, B.formatLap(Math.min(103445, lap0.time)), "and the best, if it beat it");
        eq(end.predicted, lap0.referenceMs + end.delta, "the prediction is the best plus the delta, as the game's is");
        eq(end.current, B.formatLap(end.lapMs));
        ok(lap0.time !== lap1.time && lap1.time !== lap2.time, "no two laps alike");
        eq(JSON.stringify(B.attractValues(123456)), JSON.stringify(B.attractValues(123456)), "and each the same every time it is played");
        // ten laps: every one within a second of its best, the best never rising, the optimal never slower than it, and big swings both ways
        let bigGains = 0, bigLosses = 0;
        for (let k = 0; k < 10; k += 1) {
            const L = B.attractLap(k), v = B.attractValues(L.start);
            ok(Math.abs(L.time - L.referenceMs) < 1000, "lap " + k + " within a second of the best: " + (L.time - L.referenceMs));
            if (k > 0) { ok(L.referenceMs <= B.attractLap(k - 1).referenceMs, "the best never gets worse"); }
            ok(B.parseLap(v.optimal) <= L.referenceMs, "lap " + k + ": the optimal " + v.optimal + " is never slower than the best " + v.best);
            eq(L.referenceMs, Math.min.apply(null, [103445].concat(Array.apply(null, Array(k)).map(function (x, i) { return B.attractLap(i).time; }))), "lap " + k + ": the reference is the best lap so far");
            let low = 0, high = 0;
            for (let p = 0; p <= 200; p += 1) { const d = B.attractDelta(L, p / 200); low = Math.min(low, d); high = Math.max(high, d); }
            if (low <= -150) { bigGains += 1; }
            if (high >= 150) { bigLosses += 1; }
        }
        ok(bigGains >= 3 && bigLosses >= 3, "laps that go 0.15 s and more up (" + bigGains + ") and down (" + bigLosses + ") against the best, of ten");
        // lap 0 played at 60 fps: no step a car could not make, and the trend both ways through the corners, flat for most of the lap
        let prev = null, maxStep = 0, gain = 0, lose = 0, flat = 0;
        const ring = [];
        for (let t = 0; t < lap0.time; t += 16) {
            const d = B.attractValues(t).delta;
            if (prev !== null) { maxStep = Math.max(maxStep, Math.abs(d - prev)); }
            prev = d; ring.push(d);
            if (ring.length > 63) {
                const rate = d - ring[ring.length - 64];
                if (rate <= -15) { gain += 1; } else if (rate >= 15) { lose += 1; } else { flat += 1; }
            }
        }
        ok(maxStep <= 10, "the largest step between two frames is " + maxStep + " ms");
        ok(gain > 0 && lose > 0, "time gained and lost at 15 ms/s or more somewhere: " + gain + " / " + lose + " frames");
        ok(flat > 0, "and steady at times: " + flat + " frames");
        // never stuck on a number: in every 3 s of the lap the delta moves by some milliseconds at least
        const perWindow = Math.round(3000 / 16);
        for (let w = 0; w + perWindow <= ring.length; w += perWindow) {
            const slice = ring.slice(w, w + perWindow);
            ok(Math.max.apply(null, slice) - Math.min.apply(null, slice) >= 5, "the delta moves in the 3 s from frame " + w + ": " + Math.min.apply(null, slice) + " to " + Math.max.apply(null, slice));
        }
        ok(!state.attract, "off by default");
        B.setAttract(state, true); ok(state.attract); eq(ACEUIAppLoader.settings.get(me.name, "attract"), true);
        run(200); ok(figure.textContent !== "--.---", "drawing the script"); eq(cellTime("optimal"), B.attractValues(now).optimal);
        B.setAttract(state, false); ACEUIAppLoader.settings.reset(me.name);
    });

    t("detach stops the loop, cancels the pending frame and releases the listeners", function () {
        const cancelled = clock.cancelled, ui = state.ui;
        B.detach(state);
        eq(clock.cancelled, cancelled + 1, "frame cancelled"); eq(ui.loop.running, false); eq(state.ui, null); eq(state.unsubscribeSettings, null); eq(state.scaler, null); eq(state.detached, true);
        eq(engineHandlers.UINotification, undefined, "the notification subscription is cleared"); eq(state.notifications, null);
        set("decimals", "2"); ACEUIAppLoader.settings.reset(me.name);
        eq(B.attract(true), false, "no live widget to toggle");
    });

    // anything that reached console.warn / console.error (the loop reports a frame that threw there) goes in the report
    t("no wrapped handler threw anywhere in the run: every 'nothing happens' above happened for the right reason", function () {
        // the one failure a case provokes on purpose (the model switch that throws) is expected and guarded; nothing else may have thrown
        eq(window.__log.filter(function (l) { return l.indexOf(" failed: ") >= 0 && l.indexOf("model switch failed: Error: the game refused") < 0; }).join("\n"), "", "no failure lines from the library's safely()");
    });

    H.finish(window.__warn.map(function (w) { return "WARN " + w; }));
}());
</script>
